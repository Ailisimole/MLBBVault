<!DOCTYPE html>
<html>
<head>
  <title>Rank System - MLBBVault</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0a0a0f;
      color: #eaeaea;
    }

    /* HEADER */
    .header {
      text-align: center;
      padding: 50px 20px;
      background: linear-gradient(180deg, #141428, #0a0a0f);
    }

    /* SECTION */
    .section {
      max-width: 900px;
      margin: auto;
      padding: 30px 20px;
    }

    h1, h2 {
      margin: 0;
      text-align: center;
    }

    /* BACK BUTTON */
    .btn {
      display: inline-block;
      padding: 10px 16px;
      background: #6c5ce7;
      color: white;
      border-radius: 10px;
      text-decoration: none;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .btn:hover {
      background: #7b6df0;
    }

    /* CARD */
    .card {
      background: #151522;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 15px;
      border: 1px solid #222;
      text-align: center;
      transition: 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: #444;
    }

    /* RANK ICON */
    .rank-logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      display: block;
      margin: auto;
      margin-bottom: 10px;
    }

    .tag {
      display: inline-block;
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 6px;
      background: #222;
      color: #aaa;
      margin-bottom: 8px;
    }

    /* GLOW ANIMATIONS */
    @keyframes glowPurple {
      0% { box-shadow: 0 0 10px rgba(168,140,255,0.3); }
      50% { box-shadow: 0 0 30px rgba(168,140,255,0.8); }
      100% { box-shadow: 0 0 10px rgba(168,140,255,0.3); }
    }

    @keyframes glowGold {
      0% { box-shadow: 0 0 10px rgba(255,209,102,0.3); }
      50% { box-shadow: 0 0 30px rgba(255,209,102,0.8); }
      100% { box-shadow: 0 0 10px rgba(255,209,102,0.3); }
    }

    @keyframes glowRed {
      0% { box-shadow: 0 0 10px rgba(255,77,77,0.3); }
      50% { box-shadow: 0 0 30px rgba(255,77,77,0.8); }
      100% { box-shadow: 0 0 10px rgba(255,77,77,0.3); }
    }

    @keyframes glowBlue {
      0% { box-shadow: 0 0 10px rgba(0,229,255,0.3); }
      50% { box-shadow: 0 0 35px rgba(0,229,255,0.9); }
      100% { box-shadow: 0 0 10px rgba(0,229,255,0.3); }
    }

    .mythic {
      border: 1px solid #a88cff;
      animation: glowPurple 3s ease-in-out infinite;
    }

    .honor {
      border: 1px solid #ffd166;
      animation: glowGold 3s ease-in-out infinite;
    }

    .glory {
      border: 1px solid #ff4d4d;
      animation: glowRed 3s ease-in-out infinite;
    }

    .immortal {
      border: 1px solid #00e5ff;
      animation: glowBlue 3s ease-in-out infinite;
    }

  </style>
</head>

<body>

<div class="header">
  <a class="btn" href="index.html">← Back to Home</a>
  <h1>Rank System</h1>
  <p>MLBB Competitive Progression</p>
</div>

<div class="section">

  <!-- EARLY GAME -->
  <div class="card">
    <img src="warrior.png" class="rank-logo">
    <span class="tag">Early Game</span>
    <h2>Warrior</h2>
  </div>

  <div class="card">
    <img src="elite.png" class="rank-logo">
    <span class="tag">Early Game</span>
    <h2>Elite</h2>
  </div>

  <div class="card">
    <img src="master.png" class="rank-logo">
    <span class="tag">Early Game</span>
    <h2>Master</h2>
  </div>

  <!-- MID GAME -->
  <div class="card">
    <img src="grandmaster.png" class="rank-logo">
    <span class="tag">Mid Game</span>
    <h2>Grandmaster</h2>
  </div>

  <div class="card">
    <img src="epic.png" class="rank-logo">
    <span class="tag">Mid Game</span>
    <h2>Epic</h2>
  </div>

  <!-- HIGH RANK -->
  <div class="card">
    <img src="legend.png" class="rank-logo">
    <span class="tag">High Rank</span>
    <h2>Legend</h2>
  </div>

  <!-- MYTHIC SYSTEM -->
  <div class="card mythic">
    <img src="mythic.png" class="rank-logo">
    <span class="tag">Mythic</span>
    <h2>Mythic</h2>
  </div>

  <div class="card honor mythic">
    <img src="honor.png" class="rank-logo">
    <span class="tag">Mythic Honor</span>
    <h2>Mythic Honor</h2>
  </div>

  <div class="card glory mythic">
    <img src="glory.png" class="rank-logo">
    <span class="tag">Mythic Glory</span>
    <h2>Mythic Glory</h2>
  </div>

  <div class="card immortal mythic">
    <img src="immortal.png" class="rank-logo">
    <span class="tag">Mythic Immortal</span>
    <h2>Mythic Immortal</h2>
  </div>

</div>

</body>
</html>
