<!DOCTYPE html>
<html>
<head>
  <title>MLBBVault Ranks</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0a0a0f;
      color: #eaeaea;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    /* BACK BUTTON */
    .back {
      display: inline-block;
      margin-bottom: 20px;
      padding: 10px 14px;
      background: #6c5ce7;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      transition: 0.3s;
    }

    .back:hover {
      background: #7b6df0;
      transform: scale(1.05);
    }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media(max-width:600px){
      .grid { grid-template-columns: 1fr; }
    }

    /* RANK CARDS */
    .card {
      background: #151522;
      padding: 18px;
      border-radius: 14px;
      border: 1px solid #222;
      cursor: pointer;
      transition: 0.3s;
      text-align: center;
    }

    .card:hover {
      transform: translateY(-5px) scale(1.03);
      box-shadow: 0 0 18px rgba(108,92,231,0.4);
    }

    /* DETAIL BOX */
    .detail {
      display: none;
      margin-top: 20px;
      padding: 18px;
      border-radius: 14px;
      background: #111122;
      border: 1px solid #333;
      animation: fade 0.3s ease;
    }

    @keyframes fade {
      from {opacity: 0; transform: translateY(10px);}
      to {opacity: 1; transform: translateY(0);}
    }

    /* MYTHIC GLOW */
    .glow {
      color: #c084fc;
      text-shadow: 0 0 10px #c084fc, 0 0 20px #a855f7;
    }

  </style>
</head>

<body>

<a class="back" href="index.html">← Back to Home</a>

<h1>Rank System</h1>

<div class="grid">

  <div class="card" onclick="showRank('Warrior')">Warrior</div>
  <div class="card" onclick="showRank('Elite')">Elite</div>
  <div class="card" onclick="showRank('Master')">Master</div>
  <div class="card" onclick="showRank('Grandmaster')">Grandmaster</div>
  <div class="card" onclick="showRank('Epic')">Epic</div>
  <div class="card" onclick="showRank('Legend')">Legend</div>

  <div class="card" onclick="showRank('Mythic')">Mythic</div>
  <div class="card" onclick="showRank('Mythic Honor')">Mythic Honor</div>
  <div class="card" onclick="showRank('Mythic Glory')">Mythic Glory</div>
  <div class="card" onclick="showRank('Mythic Immortal')">Mythic Immortal</div>

</div>

<!-- DETAILS -->
<div id="detail" class="detail"></div>

<script>
function showRank(rank){
  const box = document.getElementById("detail");
  box.style.display = "block";

  let text = "";

  switch(rank){
    case "Warrior":
      text = "Beginner rank. Learn basics of Mobile Legends.";
      break;

    case "Elite":
      text = "You start facing more real players.";
      break;

    case "Master":
      text = "You understand team roles and basic strategy.";
      break;

    case "Grandmaster":
      text = "Matches become more competitive.";
      break;

    case "Epic":
      text = "Draft pick starts. Strategy is important.";
      break;

    case "Legend":
      text = "High skill players and better teamwork.";
      break;

    case "Mythic":
      text = "Competitive ranked tier.";
      box.classList.add("glow");
      break;

    case "Mythic Honor":
      text = "Strong consistent Mythic players.";
      box.classList.add("glow");
      break;

    case "Mythic Glory":
      text = "Elite-level Mythic players.";
      box.classList.add("glow");
      break;

    case "Mythic Immortal":
      text = "Top leaderboard players.";
      box.classList.add("glow");
      break;
  }

  box.innerHTML = "<h2>" + rank + "</h2><p>" + text + "</p>";
}
</script>

</body>
</html>
